components:
  schemas:
    Boleto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        data_vencimento:
          type: string
          format: date
        seu_numero:
          type: string
          maxLength: 18
        numero_parcela:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        mensagem:
          type: string
        multa_percentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        juros_mes_percentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        dias_protesto:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/StatusEnum'
        nosso_numero:
          type: string
          maxLength: 30
        linha_digitavel:
          type: string
          maxLength: 100
        codigo_barras:
          type: string
          maxLength: 100
        criado_em:
          type: string
          format: date-time
          readOnly: true
        emitente:
          type: integer
        pagador:
          type: integer
      required:
      - criado_em
      - data_vencimento
      - emitente
      - id
      - pagador
      - seu_numero
      - valor
    Emitente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        razao_social:
          type: string
          maxLength: 150
        cnpj:
          type: string
          maxLength: 14
        cooperativa:
          type: string
          maxLength: 10
        agencia:
          type: string
          maxLength: 10
        conta_corrente:
          type: string
          maxLength: 20
        numero_cliente:
          type: string
          maxLength: 30
        modalidade:
          type: string
          maxLength: 10
        convenio:
          type: string
          maxLength: 30
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - agencia
      - cnpj
      - conta_corrente
      - convenio
      - cooperativa
      - criado_em
      - id
      - modalidade
      - numero_cliente
      - razao_social
    Pagador:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
        cpf_cnpj:
          type: string
          maxLength: 14
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        cep:
          type: string
          maxLength: 8
        endereco:
          type: string
          maxLength: 150
        bairro:
          type: string
          maxLength: 100
        cidade:
          type: string
          maxLength: 100
        uf:
          type: string
          maxLength: 2
        criado_em:
          type: string
          format: date-time
          readOnly: true
      required:
      - bairro
      - cep
      - cidade
      - cpf_cnpj
      - criado_em
      - endereco
      - id
      - nome
      - uf
    PatchedBoleto:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        valor:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        data_vencimento:
          type: string
          format: date
        seu_numero:
          type: string
          maxLength: 18
        numero_parcela:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        mensagem:
          type: string
        multa_percentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        juros_mes_percentual:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        dias_protesto:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        status:
          $ref: '#/components/schemas/StatusEnum'
        nosso_numero:
          type: string
          maxLength: 30
        linha_digitavel:
          type: string
          maxLength: 100
        codigo_barras:
          type: string
          maxLength: 100
        criado_em:
          type: string
          format: date-time
          readOnly: true
        emitente:
          type: integer
        pagador:
          type: integer
    PatchedEmitente:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        razao_social:
          type: string
          maxLength: 150
        cnpj:
          type: string
          maxLength: 14
        cooperativa:
          type: string
          maxLength: 10
        agencia:
          type: string
          maxLength: 10
        conta_corrente:
          type: string
          maxLength: 20
        numero_cliente:
          type: string
          maxLength: 30
        modalidade:
          type: string
          maxLength: 10
        convenio:
          type: string
          maxLength: 30
        criado_em:
          type: string
          format: date-time
          readOnly: true
    PatchedPagador:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 150
        cpf_cnpj:
          type: string
          maxLength: 14
        email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        cep:
          type: string
          maxLength: 8
        endereco:
          type: string
          maxLength: 150
        bairro:
          type: string
          maxLength: 100
        cidade:
          type: string
          maxLength: 100
        uf:
          type: string
          maxLength: 2
        criado_em:
          type: string
          format: date-time
          readOnly: true
    StatusEnum:
      enum:
      - rascunho
      - registrado
      - pago
      - vencido
      - baixado
      - erro
      type: string
      description: |-
        * `rascunho` - Rascunho
        * `registrado` - Registrado
        * `pago` - Pago
        * `vencido` - Vencido
        * `baixado` - Baixado
        * `erro` - Erro
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
